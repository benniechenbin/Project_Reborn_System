repos:
  # -------------------------------------------------------------
  # Stage 1 — Fast Fail（极速语法与安全拦截）
  # -------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict  # 1.1 Git 冲突标记检测
        args: [--assume-in-merge]
      - id: check-added-large-files # 1.2 防止误提交大文件
      - id: check-yaml            # 1.3 语法格式合法性检查
      - id: check-json
      - id: check-toml
      - id: check-ast             # 1.4 Python 语法正确性检查
      - id: debug-statements      # 1.5 拦截遗留的 debugger / breakpoint()
      - id: detect-private-key    # 1.6 拦截私钥泄漏

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks              # 1.7 敏感信息/密钥扫描

  # -------------------------------------------------------------
  # Stage 2 — Generate（代码/配置生成阶段）
  # -------------------------------------------------------------
  - repo: local
    hooks:
      - id: generate-env-example  # 2.1 安全地生成/更新 .env.example
        name: Check .env.example against Settings
        entry: uv run --no-sync python scripts/generate_env_example.py
        language: system
        files: ^(src/reborn_core/config/|\.env\.example|scripts/generate_env_example\.py)
        pass_filenames: false

  # -------------------------------------------------------------
  # Stage 3 — Semantic Auto Fix（语义级代码与文档自动修剪）
  # -------------------------------------------------------------
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        args: [--fix]
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2     # 3.3 Markdown 文档格式自动修复
        args: [--fix]

  # -------------------------------------------------------------
  # Stage 4 — Text Finalization（文本格式终极收尾修剪）
  # -------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: mixed-line-ending     # 4.1 统一换行符为 LF（兜底 Stage 2 和 Stage 3 修改的文件）
        args: [--fix=lf]
      - id: trailing-whitespace   # 4.2 消除末尾多余空格
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer     # 4.3 确保文件结尾有且仅有一个换行符

  # -------------------------------------------------------------
  # Stage 5 — Deep Validation（深层静态分析与类型推导）
  # -------------------------------------------------------------
  - repo: local
    hooks:
      - id: mypy                  # 5.1 耗时最长的类型检查与推导
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        files: ^(src|scripts)/
