[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Project_Reborn_System"
version = "0.1.0"
description = "Project Reborn - Digital Immortality System"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "llvmlite<=0.48.0",
    "cryptography>=49.0.0",
    "funasr>=1.0.0",
    "jieba>=0.42.1",
    "langchain-community==0.4.1",
    "langchain-core==1.2.31",
    "langchain-qdrant==1.1.0",
    "langchain-text-splitters==1.1.2",
    "loguru>=0.7.2",
    "modelscope>=1.39.0",
    "numpy<2.0.0",
    "openai>=2.48.0",
    "pandas>=3.0.5",
    "pydantic-settings>=2.14.2",
    "pyfiglet>=0.8.1",
    "PyYAML>=6.0",
    "qdrant-client>=1.8.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.3.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "sentence-transformers==2.6.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "streamlit>=1.60.0",
    "tenacity>=8.2.0",
    "torch>=2.4; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchvision>=0.19.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchvision==0.17.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchaudio>=2.2.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchaudio==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers>=4.41.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "transformers==4.39.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
]

[project.scripts]
reborn = "reborn_core.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reborn_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001", "TRY004", "S110"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
