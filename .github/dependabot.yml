version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      all-github-actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # The ML stack keeps Intel macOS-specific constraints in pyproject.toml.
    # Suppress routine version churn while still allowing security updates,
    # because update-types applies only to version updates.
    ignore:
      - dependency-name: "torch"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "torchvision"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "torchaudio"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "sentence-transformers"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "transformers"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "llvmlite"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      # Security updates stay review-only; no auto-merge is configured.
      ml-security-updates:
        applies-to: "security-updates"
        patterns:
          - "torch"
          - "torchvision"
          - "torchaudio"
          - "sentence-transformers"
          - "transformers"
          - "llvmlite"
      python-dev-tools:
        applies-to: "version-updates"
        patterns:
          - "mypy"
          - "ruff"
          - "pytest"
          - "pytest-cov"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
