name: Intel macOS Compatibility

on:
  push:
    branches: ["main", "master"]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/dependabot.yml"
      - ".github/workflows/intel-macos-compatibility.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/dependabot.yml"
      - ".github/workflows/intel-macos-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - run: uv lock --check
      - run: uv sync --frozen
      - name: Verify Intel ML stack imports
        run: >-
          uv run --no-sync python -c
          "import llvmlite, platform, sentence_transformers, torch, torchaudio,
          torchvision, transformers; modules = (torch, torchvision, torchaudio,
          sentence_transformers, transformers, llvmlite);
          print(f'platform={platform.system()} machine={platform.machine()}');
          [print(f'{module.__name__}={module.__version__}') for module in modules]"
